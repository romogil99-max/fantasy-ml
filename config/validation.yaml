# Esquema de validación compartido por los notebooks 03 (backtest) y 04 (predicciones).
#
# Walk-forward SEMANAL con ventana creciente: para cada semana evaluada se entrena con todos
# los partidos anteriores (desde 2023) y se predice esa semana. Solo temporada regular.

scheme: weekly_walk_forward
train_start: 2023

# Hiperparámetros: búsqueda pequeña evaluada SOLO con el walk-forward de 2024 y congelada
# después (config/model.yaml). 2026 tiene muy pocas semanas para ajustar nada con ella.
tuning_season: 2024

evaluation:
  - season: 2024
    role: tuning          # usada para elegir hiperparámetros: su error es optimista
    compare_against: [baseline]
  - season: 2025
    role: out_of_sample
    compare_against: [baseline]
  - season: 2026
    role: out_of_sample   # la liga se creó en 2026: única temporada con proyecciones de ESPN
    compare_against: [baseline, espn_projections]

# Baseline: media de los últimos 5 partidos del jugador (si no hay: temporada actual, anterior,
# o media de la posición).
baseline: rolling_mean_l5
